[package]
name = "dlmm-indexer"
description = "Live indexer for the Meteora DLMM program (Yellowstone gRPC -> Postgres)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dlmm-indexer"
path = "src/main.rs"

[dependencies]
dlmm-decoder = { path = "../dlmm-decoder" }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = "0.7"
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
yellowstone-grpc-client = "14"
yellowstone-grpc-proto = { version = "14", default-features = false }
