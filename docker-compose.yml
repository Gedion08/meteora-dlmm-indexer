# Local stack: Postgres + the indexer + Prometheus + Grafana.
#   docker compose up -d postgres          # just the database (run the indexer with cargo)
#   docker compose up -d                   # everything
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dlmm
      POSTGRES_PASSWORD: dlmm
      POSTGRES_DB: dlmm
    command: >
      postgres -c shared_buffers=1GB -c max_wal_size=4GB -c synchronous_commit=off
               -c work_mem=32MB -c maintenance_work_mem=256MB
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlmm"]
      interval: 5s
      retries: 10

  indexer:
    build: .
    command: ["run"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://dlmm:dlmm@postgres:5432/dlmm
      LOG_JSON: "true"
    ports: ["9100:9100"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  api:
    build: .
    entrypoint: ["dlmm-api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://dlmm:dlmm@postgres:5432/dlmm
      LOG_JSON: "true"
    ports: ["8080:8080"]
    expose: ["9101"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    profiles: [monitoring]

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles: [monitoring]

volumes:
  pgdata:
